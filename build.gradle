buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.26.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.7.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.82.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.32.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.76.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:2.0.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.21.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.97.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.33.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.19.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.9.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.1.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.32.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.11.0'
        classpath 'com.palantir.gradle.idea-language-injector:gradle-idea-language-injector:0.5.0'
    }
}

repositories {
    mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    gradlePluginPortal()
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.gradle-plugin-testing'
apply plugin: 'com.palantir.idea-language-injector'
apply plugin: 'com.palantir.jdks'

group 'com.palantir.gradle.shadow-jar'
version System.env.CIRCLE_TAG ?: gitVersion()

apply plugin: 'java-library'
apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'java-gradle-plugin'
apply plugin: 'groovy'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

dependencies {
    implementation localGroovy()
    implementation gradleApi()
    implementation 'com.gradleup.shadow:shadow-gradle-plugin'
    implementation 'org.apache.ant:ant'
    implementation 'org.codehaus.plexus:plexus-utils'
    implementation 'com.google.guava:guava'
    compileOnly 'com.palantir.gradle.consistentversions:gradle-consistent-versions'

    annotationProcessor 'org.immutables:value'
    compileOnly 'org.immutables:value::annotations'

    testImplementation 'commons-io:commons-io'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine', {
        because 'allows JUnit 3 and JUnit 4 tests to run'
    }

    // only to check lib is banned
    testImplementation 'com.palantir.tracing:tracing'
    testImplementation 'com.palantir.safe-logging:safe-logging'
    testImplementation 'com.palantir.tritium:tritium-registry'

    gradlePluginForTesting 'com.palantir.gradle.consistentversions:gradle-consistent-versions'
    gradlePluginForTesting 'com.netflix.nebula:nebula-publishing-plugin'
    gradlePluginForTesting 'org.unbroken-dome.test-sets:org.unbroken-dome.test-sets.gradle.plugin'
}


allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
}

gradlePlugin {
    // do not add new task to publish to plugins.gradle.org
    automatedPublishing = false
}

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
}

jdks {
    daemonTarget = 21
}

gradleTestUtils {
    configurationCacheEnabled = true
}
